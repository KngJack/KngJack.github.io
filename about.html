  <!-- 把 profile.js 里的名字与头像填进这一页 -->
  <script>
    (function () {
      var owner = window.SITE_OWNER || {};

      /* 头像还没放好时用的内置占位图（灰色小人），与首页、说说页是同一张 */
      var FALLBACK_AVATAR = 'data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2096%2096%27%3E%3Crect%20width=%2796%27%20height=%2796%27%20fill=%27%23e2e8f0%27/%3E%3Ccircle%20cx=%2748%27%20cy=%2738%27%20r=%2715%27%20fill=%27%2394a3b8%27/%3E%3Cpath%20d=%27M16%2096c0-18%2014-30%2032-30s32%2012%2032%2030z%27%20fill=%27%2394a3b8%27/%3E%3C/svg%3E';

      var avatarEl = document.getElementById('about-avatar');
      var nameEl   = document.getElementById('about-name');

      if (nameEl && owner.name) nameEl.textContent = owner.name;

      if (avatarEl) {
        avatarEl.alt = (owner.name || '') + ' 的头像';
        avatarEl.src = owner.avatar || FALLBACK_AVATAR;
        // 头像文件缺失时退回内置占位图，不出现裂图
        avatarEl.onerror = function () { this.onerror = null; this.src = FALLBACK_AVATAR; };
      }
    })();
  </script>

  <!-- ================================================================
       分段切换条：点「自我介绍 / 研究兴趣」切换下面那一栏
       ----------------------------------------------------------------
       · 用 hidden 属性控制显示，所以没有 JS 时只会看到第一栏，不会空白；
       · 支持键盘：Tab 聚焦到按钮上后，用 ← / → 也能切换。
       ================================================================ -->
  <script>
    (function () {
      'use strict';

      var tabs = [].slice.call(document.querySelectorAll('.about-tab'));
      if (!tabs.length) return;

      function select(tab) {
        tabs.forEach(function (t) {
          var on    = (t === tab);
          var panel = document.getElementById(t.getAttribute('aria-controls'));
          t.classList.toggle('is-active', on);
          t.setAttribute('aria-selected', on ? 'true' : 'false');
          if (panel) panel.hidden = !on;
        });
      }

      tabs.forEach(function (t) {
        t.addEventListener('click', function () { select(t); });

        t.addEventListener('keydown', function (e) {
          if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
          e.preventDefault();
          var i    = tabs.indexOf(t);
          var next = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
          next.focus();
          select(next);
        });
      });
    })();
  </script>
